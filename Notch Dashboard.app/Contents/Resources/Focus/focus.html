<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A little space to focus</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#080a08;color:#f4f6ef}body{margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:580px;padding:48px 28px;text-align:center}.mark{font-size:45px;color:#b8f563}.eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;color:#a1aa96;margin:26px 0}h1{font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:-1.5px;margin:0 0 18px}p{color:#a1aa96;font-size:14px;line-height:1.7}#time{color:#b8f563;font-size:44px;font-variant-numeric:tabular-nums;margin:35px 0}.hint{font-size:12px;color:#6e7766}button{background:#b8f563;color:#080a08;border:0;border-radius:24px;padding:12px 20px;cursor:pointer;font:inherit}
</style></head><body><main><div class="mark">✦</div><p class="eyebrow">NOTCH DASHBOARD</p><h1>A little space to focus.</h1><p id="status">Social media can wait. Your work has this moment.</p><div id="time">—</div><p class="hint">Pause or finish your timer in the notch to return.<br>Your music is still available.</p><button id="return" hidden>Return to your page</button></main>
<script>
const params=new URLSearchParams(location.search),until=Number(params.get('until')),original=params.get('return');
let valid=false;try{const url=new URL(original);valid=['https:','http:'].includes(url.protocol)}catch{}
const back=()=>{if(valid)location.replace(original)};
document.getElementById('return').addEventListener('click',back);
function tick(){const remaining=Math.max(0,Math.ceil(until-Date.now()/1000));document.getElementById('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(!remaining){document.getElementById('status').textContent='Your session is complete.';document.getElementById('return').hidden=!valid;back()}}
tick();setInterval(tick,1000);
</script></body></html>
